<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보통명사 — 내가 회사를 차린다면?</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#090b0f;--bg2:#0d1016;--surface:#10141b;--surface-2:#151a22;--surface-3:#1b222c;
  --text:#f4f5f7;--text-2:#c7cdd5;--muted:#7f8996;--line:rgba(255,255,255,.095);
  --line-strong:rgba(255,255,255,.16);--accent:#ece7da;--accent-ink:#151617;
  --glow:rgba(120,145,190,.16);--radius:24px;--shadow:0 30px 100px rgba(0,0,0,.38)
}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 5%,#141a24 0,#0b0e13 32%,#080a0e 72%);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}
body{overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}
#app{min-height:100dvh;display:grid;grid-template-rows:54px 1fr 32px;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(9,11,15,.7);backdrop-filter:blur(20px);z-index:3}
.brand{font-size:13px;font-weight:900;letter-spacing:.15em}
.step{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.08em}
#stage{min-height:0;display:grid;place-items:center;padding:20px}
.screen{width:min(1120px,100%);max-height:100%;display:grid;place-items:center;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:46px}
.hero h1{margin:0;font-size:clamp(54px,7vw,86px);letter-spacing:-.055em;font-weight:950}
.hero .sub{margin:14px 0 30px;color:var(--text-2);font-size:17px}
.card{width:min(1040px,100%);padding:27px 32px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));box-shadow:var(--shadow);overflow:hidden}
.setupCard{width:min(780px,100%)}
.kicker,.eyebrow{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
h2{margin:10px 0 10px;font-size:clamp(28px,3vw,38px);line-height:1.18;letter-spacing:-.035em}
.desc{margin:0 0 22px;color:var(--text-2);font-size:13px;line-height:1.65}
.input{width:100%;border:0;border-bottom:1px solid var(--line-strong);outline:0;background:transparent;color:var(--text);font-size:30px;font-weight:850;padding:14px 2px 12px}
.input::placeholder{color:#4f5865}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option,.choice{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);border-radius:14px;text-align:left;transition:.16s ease}
.option{padding:16px 17px;min-height:82px}
.option:hover,.choice:hover{border-color:var(--line-strong);background:rgba(255,255,255,.055);transform:translateY(-1px)}
.option b{display:block;margin-bottom:6px;font-size:13px}
.option span{display:block;color:var(--muted);font-size:10px;line-height:1.45}
.actions{margin-top:22px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
.primary,.ghost{border-radius:12px;padding:11px 16px;font-size:11px;font-weight:850;letter-spacing:.02em}
.primary{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--text-2)}
.questionCard{padding:22px 26px}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;font-weight:800}
.progress{height:2px;background:rgba(255,255,255,.07);margin:10px 0 18px;overflow:hidden}
.progress i{display:block;height:100%;background:#b9c0c9;transition:width .3s ease}
.questionCopy{min-height:112px}
.qtext{font-size:clamp(27px,3vw,37px);line-height:1.14;font-weight:900;letter-spacing:-.04em;margin:8px 0}
.context{white-space:pre-line;color:var(--text-2);font-size:12px;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.choice{min-height:100px;padding:13px 15px}
.choice .letter{display:block;color:#697482;font-size:8px;font-weight:900;margin-bottom:7px}
.choice strong{display:block;font-size:12px;line-height:1.32}
.choice p{margin:6px 0 0;color:var(--muted);font-size:9.5px;line-height:1.4}
.flash{text-align:center}
.flash .big{font-size:clamp(45px,6vw,68px);font-weight:950;letter-spacing:-.055em}
.flash .small{color:var(--text-2);font-size:13px;line-height:1.65}
.timeline{display:flex;align-items:center;gap:16px;justify-content:center;color:#76808b;font-size:10px}
.timeline span:not(:last-child)::after{content:"";display:inline-block;width:34px;height:1px;background:#333a44;margin-left:16px;vertical-align:middle}
.resultCard{padding:19px 24px}
.resultHero{padding-bottom:12px;border-bottom:1px solid var(--line)}
.resultHero h2{margin:5px 0 2px}
.company{color:var(--muted);font-size:10px}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:11px 0}
.metric{padding:9px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.02)}
.metric span{display:block;color:var(--muted);font-size:8px;margin-bottom:5px}
.metric b{font-size:15px}
.typeBox{padding-top:10px}
.typeName{font-size:34px;font-weight:950;letter-spacing:-.04em;margin:3px 0 2px}
.typeSubtitle{margin:-1px 0 6px;color:#9fa8b3;font-size:11px;font-weight:750}
.typeText{color:var(--text-2);font-size:10.5px;line-height:1.48}
.traits{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pill{padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.045);color:#aeb6c0;font-size:8px}
.review{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:480px;overflow:auto;margin-top:12px}
.reviewRow{padding:9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.reviewRow small{display:block;color:#697482;font-size:7.5px;margin-bottom:4px}
.reviewRow b{display:block;font-size:10px;margin-bottom:3px}
.reviewRow span{display:block;color:var(--muted);font-size:8.3px;line-height:1.35}
.hiddenSequence{text-align:center}
.quoteWall{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}
.quoteWall div{padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--text-2);font-size:11px}
.hiddenTitle{font-size:clamp(58px,9vw,100px);font-weight:950;letter-spacing:-.07em}
.note{padding:10px;border-left:2px solid #6d7680;color:var(--muted);font-size:9px;line-height:1.5;text-align:left}
footer{display:grid;place-items:center;color:#505866;font-size:8px;letter-spacing:.08em;border-top:1px solid var(--line)}

/* v5.1/v5.2 setup fitting */
.companySetup{width:min(690px,100%)}
.companySetup h2{font-size:26px}
.companySetup .input{font-size:22px}
.industrySetup{width:min(820px,100%)}
.industrySetup .option{min-height:62px;padding:10px 12px}
.industrySetup .option b{font-size:11px}
.industrySetup .option span{font-size:8.5px}

/* v5.3 teacher feedback company archetype area */
.caseLink{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.018)}
.caseHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.caseHead span{color:var(--muted);font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.caseHead b{color:#d8dde3;font-size:9px;font-weight:750}
.route{display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.route span{padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.045);color:#d2d8df;font-size:9px;font-weight:700}
.route i{color:#65707c;font-style:normal;font-size:9px}
.caseLink p{margin:8px 0 0;color:#828d99;font-size:8.8px;line-height:1.45}

/* ===== v5.4 GOLDEN-RATIO MODULAR SCALE =====
   sqrt(phi) ≈ 1.272: two steps ≈ 1.618.
*/
:root{
  --gr-0:10.2px;--gr-1:12.98px;--gr-2:16.51px;--gr-3:21px;--gr-4:26.71px;
  --gr-5:33.98px;--gr-6:43.22px;--gr-7:54.98px;--gr-8:69.94px;
  --gs-0:5px;--gs-1:8px;--gs-2:13px;--gs-3:21px;--gs-4:34px
}
@media(min-width:701px){
  .brand{font-size:var(--gr-1)!important}.step,.qmeta{font-size:var(--gr-0)!important}.kicker{font-size:var(--gr-0)!important}
  .hero h1{font-size:clamp(var(--gr-7),5.2vw,var(--gr-8))!important}.hero .sub{font-size:var(--gr-2)!important}
  h2{font-size:clamp(var(--gr-4),2.35vw,var(--gr-5))!important}.desc{font-size:var(--gr-1)!important}.input{font-size:var(--gr-4)!important}
  .option b{font-size:var(--gr-1)!important}.option span{font-size:var(--gr-0)!important}
  .qtext{font-size:clamp(var(--gr-4),2.35vw,var(--gr-5))!important}.context{font-size:var(--gr-1)!important}
  .choice strong{font-size:var(--gr-1)!important}.choice p{font-size:var(--gr-0)!important}
  .flash .big{font-size:clamp(var(--gr-6),5vw,var(--gr-7))!important}.flash .small{font-size:var(--gr-1)!important}
  .typeName{font-size:var(--gr-5)!important}.typeText,.typeSubtitle{font-size:var(--gr-0)!important}
}

/* v5.4 monopoly process */
.marketPower{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015)}
.marketPowerHead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.marketPowerHead span{color:#cdd3da;font-size:9px;font-weight:850;letter-spacing:.05em}
.marketPowerHead em{color:#727d89;font-size:8px;font-style:normal;letter-spacing:.12em;white-space:nowrap}
.marketFlow{display:grid;grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr) 18px minmax(0,1fr);align-items:stretch;gap:4px}
.flowNode{min-width:0;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.flowNode small{display:block;margin-bottom:4px;color:#68737f;font-size:7.5px;font-weight:850;letter-spacing:.08em}
.flowNode strong{display:block;color:#e3e7eb;font-size:10px;line-height:1.2}
.flowNode p{margin:4px 0 0;color:#8f99a5;font-size:8.2px;line-height:1.32;word-break:keep-all}
.flowArrow{display:grid;place-items:center;color:#596571;font-size:12px}
.caseLink p{margin:0!important;color:#9ba5b0!important;font-size:9px!important;line-height:1.52!important;word-break:keep-all}

@media(min-width:701px) and (max-height:760px){
  .card{padding:13px 18px!important}.questionCard,.resultCard{padding:13px 16px!important}
  .marketPower{margin-top:7px;padding:8px}.marketPowerHead{margin-bottom:6px}.flowNode{padding:6px 7px}
  .flowNode p{font-size:7.4px;line-height:1.22}.caseLink{padding:7px 9px!important;margin-top:6px!important}.caseLink p{font-size:7.8px!important;line-height:1.35!important}
  .metrics{margin:7px 0}.metric{padding:6px}.typeBox{padding-top:6px}.typeText{line-height:1.35}
}
@media(min-width:701px) and (max-width:920px){
  .marketFlow{grid-template-columns:1fr 14px 1fr}.marketFlow .flowArrow:nth-of-type(4){display:none}
}
@media(max-width:700px){
  body{overflow:auto}#app{height:auto;min-height:100dvh;grid-template-rows:50px 1fr 28px}#stage{padding:10px}
  .card{padding:18px 15px;border-radius:16px}.grid2,.choices{grid-template-columns:1fr}
  .questionCopy{min-height:0}.choice{min-height:72px}.metrics{grid-template-columns:repeat(2,1fr)}
  .review{grid-template-columns:1fr}.industrySetup{width:calc(100% - 16px);margin:auto}.industrySetup .grid2{grid-template-columns:1fr 1fr;gap:7px}
  .industrySetup .option{min-height:72px;padding:11px}.industrySetup .option b{font-size:12px}.industrySetup .option span{font-size:9px}
  .marketPower{margin-top:12px;padding:11px}.marketPowerHead{display:block}.marketPowerHead em{display:block;margin-top:5px}
  .marketFlow{display:grid;grid-template-columns:1fr;gap:5px}.flowArrow{transform:rotate(90deg);height:13px}.flowNode{padding:10px}
  .flowNode strong{font-size:11px}.flowNode p{font-size:9px}.caseLink p{font-size:9px!important}
}

/* true viewport scaling for PC */
@media(min-width:701px){
  #app{--ui-scale:1;position:fixed;left:50%;top:50%;width:1440px;height:900px;min-height:0;transform:translate(-50%,-50%) scale(var(--ui-scale));transform-origin:center center}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar"><div class="brand">보통명사</div><div class="step" id="stepLabel"></div></header>
  <main id="stage"></main>
  <footer>내가 회사를 차린다면?</footer>
</div>
<script>
const stage=document.getElementById('stage');
const stepLabel=document.getElementById('stepLabel');

const S={
  company:'',industry:'IT·소프트웨어',product:'',
  answers:[],traits:{PRODUCT:0,GROWTH:0,BRAND:0,EFFICIENCY:0,PEOPLE:0,TRUST:0,OPEN:0,CONTROL:0,RISK:0,SOCIAL:0},q:0
};
const industryMap={
  'IT·소프트웨어':'앱·플랫폼·AI·온라인 서비스','전자제품':'기기·생활전자·스마트 제품',
  '생활제품':'소비재·생활용품','콘텐츠':'게임·영상·음악·미디어','식품':'식음료·프랜차이즈','기타':'직접 정의한 분야'
};

const questions=[
{year:'설립 1개월 차',title:'첫 3,000만 원',text:'회사 계좌에는 3,000만 원이 있다.\n첫 제품은 일단 작동한다. 하지만 아직 만족스럽지는 않다.\n지금 가장 먼저 큰돈을 쓴다면?',choices:[
['제품을 더 다듬는다','출시를 몇 달 미뤄도 된다. 가장 아쉬운 부분부터 다시 만든다.',{PRODUCT:3,TRUST:1}],
['일단 고객을 모은다','현재 제품으로 먼저 시장 반응을 만든다. 약 1,500만 원을 광고와 홍보에 쓴다.',{GROWTH:3,BRAND:1,RISK:1}],
['원가부터 줄인다','공급처와 제작 방식을 다시 검토해 제품 하나를 팔 때 남는 돈을 늘린다.',{EFFICIENCY:3}],
['사람을 한 명 고용한다','대표 혼자 모든 일을 하는 구조부터 끝낸다.',{PEOPLE:3,PRODUCT:1}]]},
{year:'설립 5개월 차',title:'첫 가격',text:'제품 하나를 만드는 데 약 28,000원이 든다.\n비슷한 경쟁 제품은 보통 55,000~65,000원이다.',choices:[
['39,000원','초반에는 이익보다 고객 확보에 집중한다.',{GROWTH:3,RISK:1}],
['59,000원','시장 평균 수준으로 시작해 가격 자체를 변수로 만들지 않는다.',{EFFICIENCY:2,TRUST:1}],
['79,000원','디자인·서비스·포장을 강화해 처음부터 프리미엄으로 자리 잡는다.',{BRAND:3,PRODUCT:1}],
['39,000원 / 89,000원 두 종류','기본형과 고급형을 나눠 서로 다른 고객을 동시에 노린다.',{EFFICIENCY:2,GROWTH:1,BRAND:1}]]},
{year:'설립 8개월 차',title:'첫 직원',text:'현재 회사가 감당할 수 있는 직원은 딱 한 명이다.\n네 명의 선택지가 있다.',choices:[
['경력 7년 실무자','당장 전력감이다. 대신 원하는 급여가 가장 높다.',{PRODUCT:2,PEOPLE:1,EFFICIENCY:-1}],
['포트폴리오가 뛰어난 신입','가르칠 시간이 필요하지만 성장 가능성이 크다.',{PEOPLE:3,RISK:1}],
['영업 경험이 많은 지원자','제품 이해도는 평범하지만 고객을 확보하는 능력이 확실하다.',{GROWTH:3}],
['아직 뽑지 않는다','비용을 아끼고 대표가 몇 달 더 직접 처리한다.',{EFFICIENCY:3,CONTROL:1}]]},
{year:'설립 1년 차 · 누적 판매 8,300개',title:'첫 번째 문제',text:'판매된 제품 중 약 3%에서 작은 결함이 발견됐다.\n안전 문제는 없지만 일부 고객은 분명 불편할 수 있다.',choices:[
['전체 고객에게 먼저 알리고 무상 교환한다','비용은 크지만 문제를 숨기지 않는다.',{TRUST:4,EFFICIENCY:-1}],
['문제가 발생한 고객에게만 교환한다','실제 피해가 있는 고객에게 집중한다.',{TRUST:2,EFFICIENCY:2}],
['다음 생산분부터 개선한다','현재 판매는 유지하고 이후 제품부터 해결한다.',{GROWTH:2,EFFICIENCY:2,TRUST:-1}],
['별도 개선 프로그램을 제공한다','전면 교환 대신 수리·업데이트·부품 교체 방식으로 대응한다.',{PRODUCT:2,EFFICIENCY:2,TRUST:1}]]},
{year:'설립 3년 차 · 직원 23명',title:'주문이 갑자기 세 배가 됐다',text:'대형 크리에이터가 제품을 소개하면서 주문이 폭증했다.\n현재 생산량으로는 전부 공급할 수 없다.',choices:[
['외부 생산업체를 추가한다','품질 관리가 어려워질 수 있지만 지금의 수요를 놓치지 않는다.',{GROWTH:3,RISK:2,PRODUCT:-1}],
['배송 지연을 안내하고 기존 생산량을 유지한다','성장 속도보다 품질을 우선한다.',{PRODUCT:3,TRUST:2}],
['자금을 빌려 생산설비를 늘린다','위험을 감수하고 장기 생산능력을 확보한다.',{GROWTH:3,RISK:3}],
['예약 주문으로 전환한다','실제 수요를 먼저 확인하고 단계적으로 만든다.',{EFFICIENCY:3,TRUST:1}]]},
{year:'설립 3년 차',title:'대형 유통사가 연락해왔다',text:'전국적인 유통사가 제안한다.\n“판매량은 크게 늘려드릴 수 있습니다. 대신 소비자가격을 지금보다 15% 낮춰주세요.”',choices:[
['수락한다','마진은 줄어도 전국 유통망을 확보한다.',{GROWTH:3,BRAND:1,EFFICIENCY:-1}],

function screen(html,label=''){stepLabel.textContent=label;stage.innerHTML=`<section class="screen">${html}</section>`;document.body.dataset.phase=label||'transition';window.scrollTo({top:0,behavior:'smooth'})}
function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function apply(delta){for(const[k,v]of Object.entries(delta))S.traits[k]+=v}
function pct(n,min=8,max=92){return Math.max(min,Math.min(max,Math.round(n)))}
function answerIndex(qi){return S.answers.find(a=>a.q===qi)?.choice??-1}

/* 발표용 빠른 결과:
   Space + Enter를 동시에 누르면 지금까지 직접 고른 선택은 유지하고,
   아직 답하지 않은 문항만 무작위 선택한 뒤 즉시 결과 화면으로 이동한다. */
let presentationFastFinishLock=false;
function presentationFastFinish(){
  if(presentationFastFinishLock) return;
  if(!S.company || !S.product) return;
  if(S.answers.length>=questions.length) return;

  presentationFastFinishLock=true;

  const answered = new Set(S.answers.map(a=>a.q));
  for(let qi=0; qi<questions.length; qi++){
    if(answered.has(qi)) continue;
    const q = questions[qi];
    const idx = Math.floor(Math.random()*q.choices.length);
    apply(q.choices[idx][2]);
    S.answers.push({q:qi,choice:idx,title:q.title,label:q.choices[idx][0],auto:true});
  }

  S.answers.sort((a,b)=>a.q-b.q);
  S.q=questions.length;

  screen(`<div class="flash"><div class="small">발표용 빠른 결과 계산</div><div class="big" style="margin-top:22px">선택 완료</div><div class="small">직접 고른 선택은 유지하고,<br>남은 문항만 무작위로 채웠습니다.</div></div>`,'결과 계산');
  setTimeout(()=>{
    presentationFastFinishLock=false;
    showResult();
  },500);
}

function companyName(){screen(`<div class="card setupCard companySetup"><div class="kicker">01 · COMPANY</div><h2>먼저 회사의 이름을 정해주세요.</h2><p class="desc">이 이름은 12년 뒤 결과 화면까지 그대로 사용됩니다.</p><input id="companyInput" class="input" maxlength="24" placeholder="예: Aster"><div class="actions"><button class="primary" onclick="saveCompany()">다음</button></div></div>`,'회사 만들기');setTimeout(()=>document.getElementById('companyInput')?.focus(),50)}

function saveProduct(){const v=document.getElementById('productInput').value.trim();if(!v)return document.getElementById('productInput').focus();S.product=v;flash('20XX년 3월','직원 1명.<br><br>당신뿐이다.',()=>{S.q=0;renderQuestion()})}
function flash(big,small,next){screen(`<div class="flash"><div class="big">${big}</div><div class="small">${small}</div></div>`,'');setTimeout(next,1250)}

function renderQuestion(){
 const i=S.q,q=questions[i];
 const brandedText=q.text.replaceAll('BRAND',safe(S.product));
 const cs=q.choices.map((c,idx)=>`<button class="choice" onclick="choose(${idx})"><span class="letter">${'ABCD'[idx]}</span><strong>${c[0]}</strong><p>${c[1]}</p></button>`).join('');
 screen(`<div class="card questionCard"><div class="qmeta"><span>${q.year}</span><span>Q${i+1} / ${questions.length}</span></div><div class="progress"><i style="width:${i/questions.length*100}%"></i></div><div class="questionCopy"><div class="kicker">${q.title}</div><div class="qtext">${brandedText.split('\n')[0]}</div><div class="context">${brandedText.split('\n').slice(1).join('\n')}</div></div><div class="choices">${cs}</div></div>`,`질문 ${i+1} / ${questions.length}`)
}
function choose(idx){
 const q=questions[S.q];apply(q.choices[idx][2]);S.answers.push({q:S.q,choice:idx,title:q.title,label:q.choices[idx][0]});const just=S.q;S.q++;
 screen(`<div class="flash"><div class="small">결정되었습니다.</div></div>`,`질문 ${Math.min(S.q,15)} / 15`);
 setTimeout(()=>{if(just===3)return timeJump1();if(just===7)return timeJump2();if(just===11)return timeJump3();if(just===14)return preResult();renderQuestion()},420)
}
function timeJump1(){screen(`<div class="flash"><div class="small">첫 직원이 들어왔다.<br>첫 고객이 생겼다.<br>첫 환불도 있었다.<br>월급날이 찾아왔다.<br><br>그리고 회사는 아직 살아 있다.</div><div class="big" style="margin-top:30px">3년 후</div><div class="small">직원 23명.</div></div>`,'');setTimeout(renderQuestion,2200)}
function timeJump2(){screen(`<div class="flash"><div class="timeline"><span>23명</span><span>37명</span><span>61명</span><span>104명</span></div><div class="big" style="margin-top:28px">설립 6년 차</div><div class="small">직원 118명.<br><br>더 이상 모든 직원의 이름을 알 수 없다.</div></div>`,'');setTimeout(renderQuestion,2200)}
function timeJump3(){screen(`<div class="flash"><div class="small">첫 제품 · 첫 직원 · 첫 문제 · 첫 투자 · 첫 해외 주문</div><div class="big" style="margin-top:28px">설립 10년 차</div><div class="small">직원 1,240명.</div></div>`,'');setTimeout(renderQuestion,1900)}
function preResult(){screen(`<div class="flash"><div class="small">12년 동안 15번의 중요한 결정을 내렸습니다.</div><div class="big" style="margin-top:24px">그 결정들은<br>생각보다 서로 닮아 있었습니다.</div></div>`,'결과 계산');setTimeout(yearRoll,1900)}
function yearRoll(){screen(`<div class="flash"><div class="timeline"><span>1년</span><span>2년</span><span>4년</span><span>7년</span><span>9년</span><span>12년</span></div><div class="big" style="margin-top:34px">12년 후</div><div class="small">${safe(S.company)}</div></div>`,'결과');setTimeout(showResult,1700)}

function hiddenCommonNoun(){const t=S.traits,q14=answerIndex(13),q9=answerIndex(8);return t.BRAND>=8&&t.GROWTH>=8&&(t.OPEN>=5||q9!==3)&&[1,2,3].includes(q14)}
function hiddenLegacy(){const t=S.traits;return t.SOCIAL>=5&&t.TRUST>=8&&(t.PEOPLE>=5||t.OPEN>=5)&&t.EFFICIENCY>=2}
function chooseType(){return[...types].sort((a,b)=>b.score(S.traits)-a.score(S.traits))[0]}
function metrics(typeName){
 const t=S.traits;let share=pct(20+t.GROWTH*1.5+t.BRAND*.6+t.CONTROL*.35-t.OPEN*.1,12,68);
 let repurchase=pct(48+t.TRUST*1.25+t.PRODUCT*.85-t.GROWTH*.25,35,91),awareness=pct(38+t.BRAND*2+t.GROWTH*.75,28,96),overseas=pct(9+t.GROWTH*.55+t.OPEN*.9,5,52);
 let employees=Math.round(420+t.GROWTH*110+t.PEOPLE*35+t.RISK*28),revenue=Math.round(900+t.GROWTH*360+t.BRAND*125+t.EFFICIENCY*150);
 if(typeName.includes('제품')){share-=6;repurchase+=6}if(typeName.includes('효율')){revenue+=900;employees=Math.max(280,employees-260)}if(typeName.includes('사람'))employees+=220;if(typeName.includes('플랫폼'))share+=7;
 return{share:pct(share,8,74),repurchase:pct(repurchase,30,94),awareness:pct(awareness,24,98),overseas:pct(overseas,3,59),employees,revenue}
}
function fmt(n){return n.toLocaleString('ko-KR')}
function flowHtml(type){return type.path.map((x,i)=>`${i?'<div class="flowArrow">→</div>':''}<div class="flowNode"><small>STEP ${i+1}</small><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}

 const type=chooseType(),m=metrics(type.name),common=hiddenCommonNoun(),legacy=hiddenLegacy();
 const hiddenBanner=common?`<button class="primary" onclick="showCommonNoun()">결과에 이상한 변화가 있습니다</button>`:legacy?`<button class="primary" onclick="showLegacy()">마지막 기록 보기</button>`:'';
 screen(`<div class="card resultCard">
 <div class="resultHero"><div class="eyebrow">12 YEARS LATER</div><h2>${safe(S.company)}</h2><div class="company">${safe(S.industry)} · 첫 제품 ${safe(S.product)}</div></div>
 <div class="metrics"><div class="metric"><span>직원</span><b>${fmt(m.employees)}명</b></div><div class="metric"><span>연매출</span><b>${fmt(m.revenue)}억 원</b></div><div class="metric"><span>시장점유율</span><b>${m.share}%</b></div><div class="metric"><span>재구매율</span><b>${m.repurchase}%</b></div><div class="metric"><span>브랜드 인지도</span><b>${m.awareness}%</b></div><div class="metric"><span>해외매출 비중</span><b>${m.overseas}%</b></div></div>
 <div class="typeBox"><div class="kicker">YOUR CEO TYPE</div><div class="typeName">${type.name}</div><div class="typeSubtitle">${type.subtitle}</div><div class="typeText">${type.text}</div><div class="traits">${type.tags.map(x=>`<span class="pill">${x}</span>`).join('')}</div>
 <div class="marketPower"><div class="marketPowerHead"><span>독점이 되는 과정</span><em>MARKET POWER FLOW</em></div><div class="marketFlow">${flowHtml(type)}</div>
 <div class="caseLink"><div class="caseHead"><span>왜 이 기업과 비슷한가</span><b>${type.name.replace('형 CEO','')}</b></div><p>${type.caseWhy}</p></div></div>
 </div>
 <div class="actions" style="justify-content:space-between;flex-wrap:wrap"><div>${hiddenBanner}</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="ghost" onclick="showReview()">내가 만든 결정</button><button class="ghost" onclick="restart()">다시 창업하기</button></div></div>
 </div>`,'결과')
}

}
function showLegacy(){
 screen(`<div class="card hiddenSequence"><div class="kicker">SPECIAL RESULT</div><div class="hiddenTitle" style="font-size:clamp(50px,8vw,90px)">남긴 것</div><p class="desc">${safe(S.company)}의 이름은 언젠가 사라질 수도 있습니다.<br>하지만 회사가 만든 것까지 함께 사라지지는 않습니다.</p><div class="metrics"><div class="metric"><span>장학·교육 지원</span><b>${fmt(9200+S.traits.SOCIAL*1840)}명</b></div><div class="metric"><span>공개 프로젝트 참여 조직</span><b>${120+S.traits.OPEN*23}개</b></div><div class="metric"><span>지역·공공 프로젝트</span><b>${8+S.traits.SOCIAL*4}건</b></div></div><p class="note">이 결과는 ‘최고 엔딩’이 아닙니다. 당신이 반복해서 선택한 장기 판단의 한 형태입니다.</p><div class="actions"><button class="ghost" onclick="showReview()">내가 만든 결정</button><button class="ghost" onclick="restart()">다시 창업하기</button></div></div>`,'특수 결과')
}
function showReview(){
 const rows=S.answers.map((a,i)=>{const q=questions[a.q],c=q.choices[a.choice];return`<div class="reviewRow"><small>Q${i+1} · ${q.title}</small><b>${c[0]}</b><span>${c[1]}</span></div>`}).join('');
 screen(`<div class="card"><div class="kicker">YOUR DECISIONS</div><h2>내가 만든 결정</h2><p class="desc">12년 동안 반복해서 내린 판단을 한 화면에서 정리했습니다.</p><div class="review">${rows}</div><div class="actions"><button class="ghost" onclick="showResult()">결과로 돌아가기</button><button class="primary" onclick="restart()">다시 창업하기</button></div></div>`,'선택 기록')
}
function restart(){Object.assign(S,{company:'',industry:'IT·소프트웨어',product:'',answers:[],traits:{PRODUCT:0,GROWTH:0,BRAND:0,EFFICIENCY:0,PEOPLE:0,TRUST:0,OPEN:0,CONTROL:0,RISK:0,SOCIAL:0},q:0});intro()}

function scaleUI(){
 const app=document.getElementById('app');
 if(window.innerWidth<=700){app.style.removeProperty('--ui-scale');return}
 const s=Math.min(window.innerWidth/1440,window.innerHeight/900,1.18);
 app.style.setProperty('--ui-scale',String(s))
}
window.addEventListener('resize',scaleUI);

const pressedKeys=new Set();
document.addEventListener('keydown',e=>{
  const key=e.code||e.key;
  pressedKeys.add(key);

  const spaceDown=pressedKeys.has('Space') || pressedKeys.has(' ');
  const enterDown=pressedKeys.has('Enter') || pressedKeys.has('NumpadEnter');

  if(spaceDown && enterDown && String(document.body.dataset.phase||'').startsWith('질문')){
    e.preventDefault();
    presentationFastFinish();
    return;
  }

  if(e.key==='Enter' && !spaceDown){
    if(document.activeElement?.id==='companyInput')saveCompany();
    if(document.activeElement?.id==='productInput')saveProduct();
  }
});
document.addEventListener('keyup',e=>{
  pressedKeys.delete(e.code||e.key);
  if(e.code==='Space') pressedKeys.delete(' ');
});
window.addEventListener('blur',()=>pressedKeys.clear());

scaleUI();intro();
</script>
